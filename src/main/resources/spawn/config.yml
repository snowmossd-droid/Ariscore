  world_not_found_ab: "&cKhông tìm thấy thế giới."

gui:
  title: "&8ꜱᴘᴀᴡɴs"
  size: 27
  spawn-info:
    spawn:
      material: ITEM_FRAME
      displayName: "&bꜱᴘᴀᴡɴ %name%"
      lore:
        - "&8%current%/%max%"
        - "&7Click to go to this"
        - "&7Spawn area."
    random-spawn:
      material: LIGHT_BLUE_GLAZED_TERRACOTTA
      slot: 22
      displayName: "&aꜱᴘᴀᴡɴ"
      lore:
        - "&fClick to teleport to a random spawn"
