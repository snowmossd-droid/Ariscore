mysql:
  enabled: false
  host: "host"
  port: 3306
  database: "database"
  username: "username"
  password: "password"
  table-prefix: "ariscore_"
  table-name: "spawns"
  use-ssl: false

sqlite:
  enabled: true

default-name: "spawn"
default-material: "STONE"

warmup: 5
cancel_distance: 0.1

sounds:
  teleport_success:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  countdown:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0
    pitch: 1.2
  cancel:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  damaged:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 0.8
  setspawn:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.5
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  click:
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0

messages:
  setspawn: "&aSpawn &f%name% &ađã được đặt."
  setspawn_ab: "&aSpawn đã đặt!"
  teleport_success: "&aDịch chuyển tới spawn &f%name%&a."
  teleport_success_ab: "&aDịch chuyển thành công!"
  teleporting_chat: "&eDịch chuyển tới &f%name% &etrong &f{seconds}s&e... Đừng di chuyển!"
  teleporting_ab: "&eDịch chuyển tới &f%name% &etrong &f{seconds}s&e..."
  teleport_cancelled_moved: "&cDịch chuyển đã bị hủy vì bạn di chuyển!"
  teleport_cancelled_moved_ab: "&cHủy! Bạn đã di chuyển."
  teleport_cancelled_damaged: "&cDịch chuyển đã bị hủy vì bạn bị tấn công!"
  teleport_cancelled_damaged_ab: "&cHủy! Bạn bị dính dame."
  spawn_not_exist: "&cSpawn &f%name% &ckhông tồn tại."
  spawn_not_exist_ab: "&cSpawn không tồn tại."
  no_spawns: "&cChưa có spawn nào được đặt."
  no_spawns_ab: "&cChưa có spawn."
  no_permission: "&cBạn không có quyền sử dụng lệnh này."
