mysql:
  enabled: false
  host: "host"
  port: 3306
  database: "database"
  username: "username"
  password: "password"
  table-prefix: "ariscore_"
  table-name: ""
  use-ssl: false

sqlite:
  enabled: true

automatic-key-all:
  time: 300
  keys:
    common: 1
  message:
    title: '&aKey All'
    subtitle: '&a1 Common key'

crate-defaults:
  name: '&8ᴄʜᴏᴏꜱᴇ 1 ɪᴛᴇᴍ'
  size: 27
  background: false
  material: BLACK_STAINED_GLASS_PANE

gui-confirm:
  title: '&8ᴄᴏɴғɪʀᴍ'
  background: false
  material: BLACK_STAINED_GLASS_PANE
  size: 27
  items:
    reward:
      slot: 13
      lore:
        - ''
    cancel:
      slot: 11
      material: 'RED_STAINED_GLASS_PANE'
      name: '&#FF0000ᴄᴀɴᴄᴇʟ'
      lore:
        - '&fClick to cancel'
    confirm:
      slot: 15
      material: 'LIME_STAINED_GLASS_PANE'
      name: '&#0bf52bᴄᴏɴꜰʀɪᴍ'
      lore:
        - '&fClick to confirm'

