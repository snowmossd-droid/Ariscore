warmup: 5
cancel_distance: 0.1
request_timeout: 60

blocked_worlds:
  - world_nether
  - world_the_end

sounds:
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  cancel:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8
  damaged:
    sound: ENTITY_PLAYER_HURT
    volume: 1.0
    pitch: 1.0
  countdown:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0
    pitch: 1.2
  teleport_success:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  request_sent:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.0
  request_accepted:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  toggle_on:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.5
  toggle_off:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 0.5
  gui_click:
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0

