gui:
  sender:
    title: "&8ᴄᴏɴғɪʀᴍ ʀᴇǫᴜᴇsᴛ"
    size: 27
    icons:
      cancel:
        slot: 10
        material: RED_STAINED_GLASS_PANE
        display-name: "&4ᴄᴀɴᴄᴇʟ"
        lore:
          - "&7Click to cancel this request"
      location:
        slot: 12
        material: GRASS_BLOCK
        display-name: "&aʟᴏᴄᴀᴛɪᴏɴ"
        lore:
          - "&f{world}"
      player:
        slot: 13
        material: PLAYER_HEAD
        display-name: "&aᴘʟᴀʏᴇʀ"
        lore:
          - "&f{player}"
      ping:
        slot: 14
        material: FEATHER
        display-name: "&aᴘɪɴɢ"
        lore:
          - "&f{ping}ms"
      confirm:
        slot: 16
        material: LIME_STAINED_GLASS_PANE
        display-name: "&aᴄᴏɴғɪʀᴍ"
        lore:
          - "&7Click to send a teleport request"
          - "&7to &f{player}"

  accept:
    title: "&8ᴀᴄᴄᴇᴘᴛ ʀᴇǫᴜᴇsᴛ"
    size: 27
    icons:
      cancel:
        slot: 10
        material: RED_STAINED_GLASS_PANE
        display-name: "&4ᴄᴀɴᴄᴇʟ"
        lore:
          - "&7Click to cancel this request"
      location:
        slot: 12
        material: GRASS_BLOCK
        display-name: "&aʟᴏᴄᴀᴛɪᴏɴ"
        lore:
          - "&f{world}"
      player:
        slot: 13
        material: PLAYER_HEAD
        display-name: "&aᴘʟᴀʏᴇʀ"
        lore:
          - "&f{player}"
      ping:
        slot: 14
        material: FEATHER
        display-name: "&aᴘɪɴɢ"
        lore:
          - "&f{ping}ms"
      confirm:
        slot: 16
        material: LIME_STAINED_GLASS_PANE
        display-name: "&aᴄᴏɴғɪʀᴍ"
        lore:
          - "&7Click to accept this request"
          - "&7from &f{player}"

clickable_messages:
  accept_tpa:
    text:
      - "&f{player} &7đã gửi yêu cầu TPA."
      - "&a[CLICK TO ACCEPT] &7hoặc gõ &a/tpaccept {player}"
  accept_tpahere:
    text:
      - "&f{player} &7đã gửi yêu cầu TPA Here."
      - "&a[CLICK TO ACCEPT] &7hoặc gõ &a/tpaccept {player}"
