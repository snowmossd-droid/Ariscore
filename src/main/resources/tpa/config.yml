gui:
  sender:
    title: "&8ᴄᴏɴғɪʀᴍ ʀᴇǫᴜᴇsᴛ"
    size: 27
    icons:
      cancel:
        slot: 10
        material: RED_STAINED_GLASS_PANE
        display-name: "&4ᴄᴀɴᴄᴇʟ"
        lore:
          - "&7Click to cancel this request"
      location:
        slot: 12
        material: GRASS_BLOCK
        display-name: "&aʟᴏᴄᴀᴛɪᴏɴ"
        lore:
          - "&f{world}"
      player:
        slot: 13
        material: PLAYER_HEAD
        display-name: "&aᴘʟᴀʏᴇʀ"
        lore:
          - "&f{player}"
      ping:
        slot: 14
        material: FEATHER
        display-name: "&aᴘɪɴɢ"
        lore:
          - "&f{ping}ms"
      confirm:
        slot: 16
        material: LIME_STAINED_GLASS_PANE
        display-name: "&aᴄᴏɴғɪʀᴍ"
        lore:
          - "&7Click to send a teleport request"
          - "&7to &f{player}"

  accept:
    title: "&8ᴀᴄᴄᴇᴘᴛ ʀᴇǫᴜᴇsᴛ"
    size: 27
    icons:
      cancel:
        slot: 10
        material: RED_STAINED_GLASS_PANE
        display-name: "&4ᴄᴀɴᴄᴇʟ"
        lore:
          - "&7Click to cancel this request"
      location:
        slot: 12
        material: GRASS_BLOCK
        display-name: "&aʟᴏᴄᴀᴛɪᴏɴ"
        lore:
          - "&f{world}"
      player:
        slot: 13
        material: PLAYER_HEAD
        display-name: "&aᴘʟᴀʏᴇʀ"
        lore:
          - "&f{player}"
      ping:
        slot: 14
        material: FEATHER
        display-name: "&aᴘɪɴɢ"
        lore:
          - "&f{ping}ms"
      confirm:
        slot: 16
        material: LIME_STAINED_GLASS_PANE
        display-name: "&aᴄᴏɴғɪʀᴍ"
        lore:
          - "&7Click to accept this request"
          - "&7from &f{player}"

clickable_messages:
  accept_tpa:
    text:
      - "&#37BFF8{player} &7đã gửi cho bạn yêu cầu tpa."
      - "&#00A3FB[NHẤN ĐỂ CHẤP NHẬN] &7hoặc gõ &#00A3FB/tpaccept {player}"
  accept_tpahere:
    text:
      - "&#37BFF8{player} &7đã gửi cho bạn yêu cầu tpahere."
      - "&#00A3FB[NHẤN ĐỂ CHẤP NHẬN] &7hoặc gõ &#00A3FB/tpaccept {player}"
