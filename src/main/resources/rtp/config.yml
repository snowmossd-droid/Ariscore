warmup: 5
cancel_distance: 0.1
cooldown: 300

sounds:
  open_gui:
    sound: BLOCK_CHEST_OPEN
    volume: 1.0
    pitch: 1.0
  click:
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0
  teleport_success:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  countdown:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0
    pitch: 1.2
  cancel:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8
  damaged:
    sound: ENTITY_PLAYER_HURT
    volume: 1.0
    pitch: 1.0

messages:
  cooldown:
    - "&#FF5555Bạn cần chờ &e{seconds}s &ctrước khi dùng /rtp lại."
  cooldown_ab: "&#FF5555Còn &e{seconds}s &ctới khi hết cooldown"
