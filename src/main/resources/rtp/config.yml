warmup: 5
cancel_distance: 0.1
cooldown: 10

sounds:
  open_gui:
    sound: BLOCK_CHEST_OPEN
    volume: 1.0
    pitch: 1.0
  click:
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0
  searching:
    sound: BLOCK_PORTAL_TRIGGER
    volume: 0.5
    pitch: 1.5
  teleport_success:
    sound: ENTITY_ENDERMAN_TELEPORT
    volume: 1.0
    pitch: 1.0
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  countdown:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0
    pitch: 1.2
  cancel:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 0.8
  damaged:
    sound: ENTITY_PLAYER_HURT
    volume: 1.0
    pitch: 1.0

messages:
  cooldown:
    - "&cYou need to wait &#00A3FB{seconds}s &cbefore using /rtp again."
  cooldown_ab: "&cYou need to wait &#00A3FB{seconds}s &cbefore using /rtp again."
  searching_location:
    - "&7Searching for a safe location..."
  searching_location_ab: "&7Searching for a safe location..."
  no_safe_location:
    - "&cCould not find a safe location!"
  no_safe_location_ab: "&cCould not find a safe location!"
  warmup:
    - "&7Teleporting in &#00A3FB{seconds}s..."
  warmup_ab: "&7Teleporting in &#00A3FB{seconds}s..."
  teleport_success:
    - "&aTeleported successfully!"
  teleport_success_ab: "&aTeleported successfully!"
  teleport_cancelled_moved:
    - "&cTeleport cancelled because you moved!"
  teleport_cancelled_moved_ab: "&cTeleport cancelled because you moved!"
  teleport_cancelled_damaged:
    - "&cTeleport cancelled because you were attacked!"
  teleport_cancelled_damaged_ab: "&cTeleport cancelled because you were attacked!"
