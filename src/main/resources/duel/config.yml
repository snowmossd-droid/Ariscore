sounds:
  click:
    sound: UI_BUTTON_CLICK
    volume: 1.0
    pitch: 1.0
  confirm:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.5
  success:
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 1.0
    pitch: 1.2
  error:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  invite:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.2
  queue_join:
    sound: BLOCK_NOTE_BLOCK_CHIME
    volume: 1.0
    pitch: 1.0
  queue_leave:
    sound: BLOCK_NOTE_BLOCK_BASS
    volume: 1.0
    pitch: 1.0
  countdown:
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 1.0
    pitch: 1.0
  fight:
    sound: ENTITY_ENDER_DRAGON_GROWL
    volume: 0.6
    pitch: 1.5
  win:
    sound: UI_TOAST_CHALLENGE_COMPLETE
    volume: 1.0
    pitch: 1.0
  lose:
    sound: ENTITY_WITHER_HURT
    volume: 0.6
    pitch: 0.8
  draw:
    sound: BLOCK_NOTE_BLOCK_BELL
    volume: 1.0
    pitch: 1.0

gui:
  queue-confirm:
    title: "&8Xác Nhận Trận Đấu"
    size: 27
    items:
      opponent-info:
        slot: 11
        display-name: "&e{player}"
        lore:
          - "&7Đối thủ được ghép cặp với bạn."
      stats:
        slot: 13
        material: PAPER
        display-name: "&6Thống Kê Của Bạn"
        lore:
          - "&7Thắng: &f{wins}"
          - "&7Thua: &f{losses}"
          - "&7Chuỗi thắng: &f{streak}"
      confirm:
        slot: 15
        material: LIME_STAINED_GLASS_PANE
        display-name: "&aXác Nhận"
        lore:
          - "&7Bấm để xác nhận trận đấu."
      cancel:
        slot: 20
        material: RED_STAINED_GLASS_PANE
        display-name: "&cHủy"
        lore:
          - "&7Bấm để hủy trận đấu."

  create-duel:
    title: "&8Tạo Trận Đấu - {player}"
    size: 27
    random-label: "Ngẫu Nhiên"
    items:
      opponent-info:
        slot: 11
        display-name: "&e{player}"
        lore:
          - "&7Bạn sắp thách đấu"
          - "&7người chơi này."
      arena:
        slot: 13
        material: MAP
        display-name: "&bKhu Vực Đấu&8: &f{arena}"
        lore:
          - "&7Bấm để đổi khu vực đấu."
          - "&7Để Ngẫu Nhiên để plugin"
          - "&7tự chọn giúp bạn."
      confirm:
        slot: 15
        material: LIME_STAINED_GLASS_PANE
        display-name: "&aGửi Lời Mời"
        lore:
          - "&7Bấm để gửi lời mời đấu."
      cancel:
        slot: 20
        material: RED_STAINED_GLASS_PANE
        display-name: "&cHủy"
        lore:
          - "&7Bấm để hủy."
