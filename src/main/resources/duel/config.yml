mysql:
  enabled: false
  host: localhost
  port: 3306
  database: ariscore
  username: root
  password: password
  use-ssl: false
  table-prefix: ariscore_

queue:
  confirm-time: 15

duel:
  invite-expire: 30
  countdown: 5
  loot-time: 120
  keep-inventory: false

match-blocked-commands:
  - "/tpa"
  - "/tpahere"
  - "/tpaccept"
  - "/home"
  - "/homes"
  - "/spawn"
  - "/warp"
  - "/afk"
  - "/rtp"

rewards:
  enabled: false
  money-per-win: 0

title-defaults:
  fade-in: 5
  stay: 40
  fade-out: 10

titles:
  duel_start_title: "<yellow><bold>ĐẤU TAY ĐÔI"
  duel_start_subtitle: "<gray>gặp <white>{opponent}"
  duel_countdown_title: "<gold>{seconds}"
  duel_countdown_subtitle: "<gray>Chuẩn bị chiến đấu!"
  duel_win_title: "<green><bold>CHIẾN THẮNG"
  duel_win_subtitle: "<gray>Bạn đã đánh bại <white>{opponent}"
  duel_lose_title: "<red><bold>THUA CUỘC"
  duel_lose_subtitle: "<gray>Bạn đã bị <white>{opponent} <gray>đánh bại"
  duel_draw_title: "<yellow><bold>HÒA"
  duel_draw_subtitle: "<gray>Không ai chết cả"

