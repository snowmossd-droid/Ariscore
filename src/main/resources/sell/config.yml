player-only: '&cThis command is only for players!'
level-up: '&a&l(!) &fYour &#a020f0%category% &fmultiplier has increased to &#a020f0%multiplier%x&f!'

chat-input:
  use-sign: true
  use-chat: false

sign-lines:
  - ''
  - '↑↑↑↑↑↑↑↑↑↑↑↑↑'
  - '   Search   '
  - ''

sell-sound:
  enabled: true
