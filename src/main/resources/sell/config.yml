  pitch: 1.0

menu-click-sound:
  enabled: true
  sound: UI_BUTTON_CLICK
  volume: 0.3
  pitch: 1.2

sellwand:
  no-permission: '&cYou do not have permission to use this command.'
  usage: '&cUsage: /sellwand give <player> <type> <value>'
  usage-types: '&cTypes: uses, time'
  usage-example-uses: '&cExample: /sellwand give Notch uses 500'
  usage-example-time: '&cExample: /sellwand give Notch time 3d'
  player-not-found: '&cPlayer not found.'
  invalid-uses: '&cInvalid uses value.'
  invalid-type: '&cInvalid type. Use ''uses'' or ''time''.'
  invalid-time: '&cInvalid time value. Example: 3d, 1h, 30m'
