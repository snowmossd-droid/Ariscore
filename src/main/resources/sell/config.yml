gui-title: '&8ᴘʟᴀᴄᴇ ɪᴛᴇᴍs ɪɴ ʜᴇʀᴇ ᴛᴏ sᴇʟʟ'
sell-message: '&a+%price%'
search-prompt: '&atype the item name in chat to search:'
search-cancelled: '&cSearch cancelled.'
reload-success: '&aSell module reloaded successfully!'
