prefix-enable: true
prefix: '&#00fc88ᴀᴜᴄᴛɪᴏɴ &7» '

chat-broadcast:
  enable: true
  use-prefix: false
  message: '&#00fc88%player% &fhas listed &a%amount% %item% &ffor &#00fc88%price% &fon the auction house &7(/ah)'

# Where each message below should be displayed.
# chat-enable: show the message in chat
# actionbar-enable: show the message in the actionbar
display:
  chat-enable: true
  actionbar-enable: true

