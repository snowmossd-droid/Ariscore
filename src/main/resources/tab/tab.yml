# ─────────────────────────────────────────────────────────────────
#  DonutTab — tab list header/footer
# ─────────────────────────────────────────────────────────────────
#  Profiles are evaluated TOP-DOWN per player. The first one whose
#  display-condition matches (or has no condition) wins.
#
#  Conditions use PlaceholderAPI placeholders + an operator:
#    ==   equals          !=   not equals
#    >    greater         <    less
#    >=   gte             <=   lte
#    contains   startsWith   endsWith
#
#  Examples:
#    "%player_world%==world"
#    "%vault_eco_balance%>1000"
#    "%donutsmpcore_team_name%!=&cN/A"
#    "%player_has_permission_donut.staff%==true"
# ─────────────────────────────────────────────────────────────────

enabled: true

# ─────────────────────────────────────────────────────────────────
#  Above-head nametag (the name floating over each player's head).
#  Renders as: <prefix><player name><suffix>. Uses scoreboard-team
#  packets so it works on Paper, Folia and Canvas. Supports the same
#  placeholders as the tab list, including %luckperms_prefix% /
#  %luckperms_suffix%.
# ─────────────────────────────────────────────────────────────────
nametag:
  enabled: true
  prefix: '%luckperms_prefix%'
  suffix: '%luckperms_suffix%'
  # How often (ticks) the nametag refreshes. 40 = every 2s.
  update-interval-ticks: 40

tabs:
  default:
    header:
      - ''
      - <#00ADFC>&lDonutSMP</#00FCFC>
      - '&f%server_online% Players'
      - ''
    footer:
      - ''
      - '   &#37BFF9/ᴅɪꜱᴄᴏʀᴅ  /ɢᴜɪᴅᴇ  /ꜱᴛᴏʀᴇ   '
      - ''
    # The line shown next to each player in the tab list. Supports the same
    # placeholders as header/footer plus LuckPerms built-ins (%luckperms_prefix%
    # and %luckperms_suffix%) — these are resolved directly from the LP API
    # so you do NOT need the LuckPerms-PAPI expansion. If a player has no LP
    # rank set, the placeholder resolves to an empty string and you just get
    # the player's name. Set to empty string to keep the vanilla name.
    tablist-name-format: '%luckperms_prefix%%player_name%%luckperms_suffix%'