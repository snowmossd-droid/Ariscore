# ─────────────────────────────────────────────────────────────────
#  DonutTab — scoreboards
# ─────────────────────────────────────────────────────────────────
#  Profiles are evaluated TOP-DOWN per player. The first one whose
#  display-condition matches (or has no condition) wins.
#
#  Conditions use PlaceholderAPI placeholders + an operator:
#    ==   equals          !=   not equals
#    >    greater         <    less
#    >=   gte             <=   lte
#    contains   startsWith   endsWith
#
#  Color codes: standard &a/&l + hex (&#RRGGBB or <#RRGGBB>...</#RRGGBB>
#  for gradients).
# ─────────────────────────────────────────────────────────────────

enabled: true

scoreboards:

  in-team:
    display-condition: "%donutteams_name%!=&cN/A"
    title: '  <#007CF9>&lDonutSMP</#00C6F9>  '
    lines:
      - ''
      - '&#00FC00$ &fMoney &#00FC00%donutstats_money%'
      - '&#A303F9★ &fShards &#A303F9%donutstats_shards%'
      - '&#FC0000🗡 &fKills &#FC0000%donutstats_kills%'
      - '&#F97603☠ &fDeaths &#F97603%donutstats_deaths%'
      - '&#00A4FC⌛ &fKeyall &#00A4FC%donutkeyall_countdown%'
      - '&#FCE300⌚ &fPlaytime &#FCE300%donutstats_playtime%'
      - '&#00A4FC🪓 &fTeam &#00A4FC%donutteams_name%'
      - ''
      - '&#A8A8A8Europe (&#00A4FC%player_ping%&#A8A8A8)'

  not-in-team:
    title: '  <#007CF9>&lDonutSMP</#00C6F9>  '
    lines:
      - ''
      - '&#00FC00$ &fMoney &#00FC00%donutstats_money%'
      - '&#A303F9★ &fShards &#A303F9%donutstats_shards%'
      - '&#FC0000🗡 &fKills &#FC0000%donutstats_kills%'
      - '&#F97603☠ &fDeaths &#F97603%donutstats_deaths%'
      - '&#00A4FC⌛ &fKeyall &#00A4FC%donutkeyall_countdown%'
      - '&#FCE300⌚ &fPlaytime &#FCE300%donutstats_playtime%'
      - ''
      - '&#A8A8A8Europe (&#00A4FC%player_ping%&#A8A8A8)'
