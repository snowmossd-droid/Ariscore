title: "ORDERS -> New Order"
rows: 3
selected-item-slot: 13

filler:
  enabled: true
  material: GRAY_STAINED_GLASS_PANE
  name: " "

buttons:
  cancel:
    slot: 11
    action: back
    material: RED_STAINED_GLASS_PANE
    name: "&cCancel"
    lore:
      - "&fClick to cancel and go back"

  amount-set:
    slot: 12
    action: set-amount
    material: BROWN_TERRACOTTA
    name: "&6Amount: &f%amount%"
    lore:
      - "&7Click to type a custom amount"
      - "&7Min: %min-amount% / Max: %max-amount%"

  price-set:
    slot: 14
    action: set-price
    material: EMERALD
    name: "&aPrice: &f%price%/each"
    lore:
      - "&7Click to type a custom price"
      - "&7Min: %min-price% / Max: %max-price%"
      - ""
      - "&7Total: &a%total%"

  confirm:
    slot: 15
    action: confirm
    material: LIME_STAINED_GLASS_PANE
    name: "&aConfirm"
    lore:
      - "&fClick to confirm and create this order"
