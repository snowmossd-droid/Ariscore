name: ArisCore
version: 1.1
main: me.vennlmao.ariscore.ArisCore
api-version: '1.21'
folia-supported: true
authors:
  - vennlmao
softdepend:
  - Vault
  - PlaceholderAPI
  - WorldGuard
  - WorldEdit
  - LuckPerms

commands:
  rtp:
    description: Random teleport
    usage: /rtp
    aliases: [randomtp]
  randomtp:
    description: Random teleport
    usage: /randomtp
  tpa:
    description: Send a teleport request
    usage: /tpa <player>
  tpahere:
    description: Send a tpahere request
    usage: /tpahere <player>
  tpaccept:
    description: Accept a TPA teleport request
    usage: /tpaccept
  tpahereaccept:
    description: Open GUI to accept a TPAHERE request
    usage: /tpahereaccept
  tpacancel:
    description: Cancel your teleport request
    usage: /tpacancel
  tpadeny:
    description: Deny an incoming teleport request
    usage: /tpadeny
  tpauto:
    description: Toggle auto-accept
    usage: /tpauto
  tpatoggle:
    description: Toggle receiving tpa
    usage: /tpatoggle
  tpaheretoggle:
    description: Toggle receiving tpahere
    usage: /tpaheretoggle
  homes:
    description: Open homes GUI
    usage: /homes
  home:
    description: Teleport to a home
    usage: /home <name>
  sethome:
    description: Set a home
    usage: /sethome <name>
  delhome:
    description: Delete a home
    usage: /delhome <name>
  shop:
    description: Open the shop
    usage: /shop
  shards:
    description: Manage shards
    usage: /shards <give|take|reset> <player|all> [amount]
    aliases: [shard]
  team:
    description: Team management
    usage: /team [create|disband|invite|join|leave|kick|sethome|delhome|home|chat|info|reload]
  ariscore:
    description: ArisCore admin command
    usage: /ariscore reload [module]
  ah:
    description: Open the auction house
    usage: /ah [sell <price>|search <term>|view <player>|reload|help]
    aliases: [auction]
  auction:
    description: Open the auction house
    usage: /auction [sell <price>|search <term>|view <player>|reload|help]
  ahfastbuytoggle:
    description: Toggle fast buy mode
    usage: /ahfastbuytoggle
  ahfastselltoggle:
    description: Toggle fast sell mode
    usage: /ahfastselltoggle
  sell:
    description: Open the sell menu
    usage: /sell
    permission: ariscore.sell.use
    permission-message: "&cYou do not have permission to use this command!"
  worth:
    description: View item prices
    usage: /worth
    permission: ariscore.sell.worth
    permission-message: "&cYou do not have permission to use this command!"
  sellhistory:
    description: View your sell history
    usage: /sellhistory
    permission: ariscore.sell.history
    permission-message: "&cYou do not have permission to use this command!"
  sellmulti:
    description: View your sell multipliers
    usage: /sellmulti
    permission: ariscore.sell.multi
    permission-message: "&cYou do not have permission to use this command!"
  sellwand:
    description: Give a sell wand
    usage: /sellwand give <player> <type> <value>
    permission: ariscore.sell.sellwand
  selladmin:
    description: Sell module admin commands
    usage: /selladmin reload
    permission: ariscore.sell.admin
  tab:
    description: Tab module admin command
    usage: /tab reload
    permission: ariscore.tab.admin
  order:
    description: Open the order system
    usage: /order [my|new|reload]
    permission: ariscore.order.use
    permission-message: "&cYou do not have permission!"
  setspawn:
    description: Set a named spawn point
    usage: /setspawn [name]
    permission: arisspawn.setspawn
  delspawn:
    description: Delete a named spawn point
    usage: /delspawn <name>
    permission: arisspawn.delspawn
  spawn:
    description: Teleport to a spawn or open spawns GUI
    usage: /spawn [name]
  spawns:
    description: Open the spawns GUI
    usage: /spawns
  setafk:
    description: Set a named AFK zone
    usage: /setafk [name]
    permission: arisafk.setafk
  delafk:
    description: Delete a named AFK zone
    usage: /delafk <name>
    permission: arisafk.delafk
  afk:
    description: Teleport to an AFK zone or open AFK zones GUI
    usage: /afk [name]
  afks:
    description: Open the AFK zones GUI
    usage: /afks
  setwarp:
    description: Set a named warp point
    usage: /setwarp [name]
    permission: ariswarp.setwarp
  delwarp:
    description: Delete a named warp point
    usage: /delwarp <name>
    permission: ariswarp.delwarp
  warp:
    description: Teleport to a warp or open warps GUI
    usage: /warp [name]
  warps:
    description: Open the warps GUI
    usage: /warps
  setwarp:
    description: Set a named warp point
    usage: /setwarp [name]
    permission: ariswarp.setwarp
  delwarp:
    description: Delete a named warp point
    usage: /delwarp <name>
    permission: ariswarp.delwarp
  warp:
    description: Teleport to a warp or open warps GUI
    usage: /warp [name]
  warps:
    description: Open the warps GUI
    usage: /warps
  crates:
    description: Manage crates (admin)
    usage: /crates [reload|givekey|takekey|create|movehere|edit]
    permission: ariscrates.admin

permissions:
  ariscore.sell.use:
    description: Allow using /sell
    default: op
  ariscore.sell.worth:
    description: Allow using /worth
    default: op
  ariscore.sell.history:
    description: Allow using /sellhistory
    default: op
  ariscore.sell.multi:
    description: Allow using /sellmulti
    default: op
  ariscore.sell.sellwand:
    description: Allow using /sellwand
    default: op
  ariscore.sell.admin:
    description: Allow using /selladmin
    default: op
  ariscore.auction.sell:
    description: Allow listing items on auction house
    default: op
  ariscore.auction.admin:
    description: Allow auction admin commands
    default: op
  ariscore.auction.fastsell:
    description: Allow fast sell toggle
    default: op
  ariscore.auction.fastbuy:
    description: Allow fast buy toggle
    default: op
  ariscore.tab.admin:
    description: Access to /tab reload
    default: op
  ariscore.tab.bypass:
    description: Bypass tab/scoreboard/nametag rendering
    default: false
  ariscore.order.use:
    description: Access to /order command
    default: op
  ariscore.order.admin:
    description: Admin access to /order reload
    default: op
  arishomes.homes.1:
    description: Allow 1 home
    default: true
  arishomes.homes.2:
    description: Allow 2 homes
    default: false
  arishomes.homes.3:
    description: Allow 3 homes
    default: false
  arishomes.homes.4:
    description: Allow 4 homes
    default: false
  arishomes.homes.5:
    description: Allow 5 homes
    default: false
  arishomes.homes.10:
    description: Allow 10 homes
    default: false
  arishomes.homes.20:
    description: Allow 20 homes
    default: false
  arishomes.homes.50:
    description: Allow 50 homes
    default: false
  arishomes.homes.100:
    description: Allow 100 homes
    default: false
  arisspawn.setspawn:
    description: Allow setting spawn points
    default: op
  arisspawn.delspawn:
    description: Allow deleting spawn points
    default: op
  arisafk.setafk:
    description: Allow setting AFK zones
    default: op
  arisafk.delafk:
    description: Allow deleting AFK zones
    default: op
  ariswarp.setwarp:
    description: Allow setting warp points
    default: op
  ariswarp.delwarp:
    description: Allow deleting warp points
    default: op
  ariswarp.setwarp:
    description: Allow setting warp points
    default: op
  ariswarp.delwarp:
    description: Allow deleting warp points
    default: op
  ariscrates.admin:
    description: Access to crate admin commands (/crates reload|givekey|takekey|create|movehere|edit)
    default: op
