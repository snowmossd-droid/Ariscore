name: Build Ariscore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Download Skidfuscator
        run: |
          curl -fL -o skidfuscator.jar \
            https://github.com/skidfuscatordev/skidfuscator-java-obfuscator/releases/download/2.0.11/skidfuscator.jar

      - name: Download Libraries
        run: |
          mkdir -p libs
          FOLIA_VERSION=$(curl -fsSL "https://api.papermc.io/v2/projects/folia" \
            | python3 -c "import sys,json; versions=json.load(sys.stdin)['versions']; print([x for x in versions if x.startswith('1.21')][-1])")
          FOLIA_BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/folia/versions/${FOLIA_VERSION}" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['builds'][-1])")
          echo "Folia ${FOLIA_VERSION} build ${FOLIA_BUILD}"
          curl -fSL -o libs/folia.jar \
            "https://api.papermc.io/v2/projects/folia/versions/${FOLIA_VERSION}/builds/${FOLIA_BUILD}/downloads/folia-${FOLIA_VERSION}-${FOLIA_BUILD}.jar"
          curl -fSL -o libs/PlaceholderAPI.jar \
            "https://github.com/PlaceholderAPI/PlaceholderAPI/releases/download/2.12.2/PlaceholderAPI-2.12.2.jar"

      - name: Obfuscate JAR
        run: |
          java -Xmx3G -jar skidfuscator.jar obfuscate target/ariscore-1.1.jar \
            --output target/ariscore-obf.jar \
            -li=libs

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore
          path: target/ariscore-obf.jar
          if-no-files-found: error
