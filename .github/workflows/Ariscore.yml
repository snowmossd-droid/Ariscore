name: Build Ariscore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Download ArisObfuscator
        run: |
          curl -L \
            -o aris-obfuscator.jar \
            https://github.com/snowmossd-droid/aris-obfuscator/releases/latest/download/aris-obfuscator.jar

      - name: Obfuscate
        run: java -jar aris-obfuscator.jar target/ariscore-1.1.jar target/ariscore-obf.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore
          path: target/ariscore-obf.jar
          if-no-files-found: error


          
          
