name: Build Ariscore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Download Skidfuscator
        run: |
          wget -q https://github.com/skidfuscator/skidfuscator-java-obfuscator/releases/latest/download/skidfuscator.jar

      - name: Download Folia 1.21
        run: |
          wget -q https://api.papermc.io/v2/projects/folia/versions/1.21/builds/27/downloads/folia-1.21-27.jar -O server.jar

      - name: Obfuscate JAR
        run: |
          java -jar skidfuscator.jar obfuscate target/ariscore-*.jar \
            --libs server.jar \
            --output target/ariscore-obf.jar \
            --exclude me/vennlmao/ariscore/libs/**

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore
          path: target/ariscore-obf.jar
