name: Build Ariscore (Test - No Obfuscation)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Dependency tree (check for log4j / unwanted transitive libs)
        run: mvn dependency:tree -B > dependency-tree.txt

      - name: Upload dependency tree
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: dependency-tree.txt

      - name: Upload JAR (unobfuscated)
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore-test
          path: target/ariscore-1.2.jar
          if-no-files-found: error
