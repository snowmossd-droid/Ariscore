name: Build Ariscore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Rename JAR
        run: cp target/ariscore-1.1.jar target/ariscore-obf.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore
          path: target/ariscore-obf.jar
          if-no-files-found: error
