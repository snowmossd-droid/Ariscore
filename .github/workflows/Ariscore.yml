name: Build Ariscore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Download Skidfuscator
        run: |
          curl -fL -o skidfuscator.jar \
            https://github.com/skidfuscatordev/skidfuscator-java-obfuscator/releases/download/2.0.11/skidfuscator.jar

      - name: Download Libraries
        run: |
          mkdir -p libs

          FOLIA_VERSION="1.21"
          FOLIA_BUILD=$(curl -fsSL "https://api.papermc.io/v2/projects/folia/versions/${FOLIA_VERSION}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['builds'][-1])")
          echo "Using Folia build: $FOLIA_BUILD"
          curl -fSL -o libs/folia.jar \
            "https://api.papermc.io/v2/projects/folia/versions/${FOLIA_VERSION}/builds/${FOLIA_BUILD}/downloads/folia-${FOLIA_VERSION}-${FOLIA_BUILD}.jar"

          curl -fSL -o libs/PlaceholderAPI.jar \
            "https://github.com/PlaceholderAPI/PlaceholderAPI/releases/download/2.11.6/PlaceholderAPI-2.11.6.jar"

      - name: Obfuscate JAR
        run: |
          java -Xmx3G -jar skidfuscator.jar obfuscate target/ariscore-1.1.jar \
            --output target/ariscore-obf.jar \
            -li=libs

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore
          path: target/ariscore-obf.jar
          if-no-files-found: error
