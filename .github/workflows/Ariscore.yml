name: Build Ariscore

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -B

      - name: Check target folder
        run: ls -la target/

      - name: Download Skidfuscator
        run: |
          curl -L -o skidfuscator.jar \
            https://github.com/skidfuscatordev/skidfuscator-java-obfuscator/releases/download/2.0.11/skidfuscator.jar

      - name: Obfuscate JAR
        run: |
          java -jar skidfuscator.jar obfuscate target/ariscore-1.1.jar \
            --output target/ariscore-obf.jar \
            --exclude me/vennlmao/ariscore/libs/**

      - name: Check obfuscated JAR
        run: ls -la target/ariscore-obf.jar

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Ariscore
          path: target/ariscore-obf.jar
          if-no-files-found: error
